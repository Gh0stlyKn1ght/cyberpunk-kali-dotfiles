# CyberKali Hyprland session
# This file is intentionally small. Host-specific monitor/input overrides belong
# in ~/.config/hypr/cyberkali-local.conf so upgrades remain safe.

$mod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

monitor = ,preferred,auto,1

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = ~/.config/cyberkali/bin/launch-shell

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(ff2d3dee) rgba(77e2f2ee) 45deg
    col.inactive_border = rgba(333843aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 3
    active_opacity = 1.0
    inactive_opacity = 0.94

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.17
    }

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(00000099)
    }
}

animations {
    enabled = true
    bezier = cyber, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, cyber, slide
    animation = windowsOut, 1, 4, cyber, slide
    animation = fade, 1, 4, cyber
    animation = workspaces, 1, 5, cyber, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

source = ~/.config/hypr/cyberkali-keybinds.conf
source = ~/.config/hypr/cyberkali-local.conf
